<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 문장 조립 연습</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="padding-bottom:40px">
  <h1>🧩 영어 문장 조립 연습</h1>
  <p class="sub">질문을 듣고 → 단어를 순서대로 맞춰 문장을 만들고 → 소리 내어 말해 보세요. 무료예요.</p>

  <div class="row" style="margin-bottom:6px">
    <button class="tab" data-cat="interview">💼 면접</button>
    <button class="tab" data-cat="work">🏢 회사 대화</button>
    <span class="grow"></span>
    <a href="review.html">📱 복습</a>
    <a href="ai.html" class="muted">🤖 AI 대화</a>
  </div>
  <div id="micNotice" class="card notice" hidden>
    <b>이 브라우저는 음성 인식을 지원하지 않아요.</b> Chrome이나 Edge로 열면 말하기 채점도 할 수 있어요.
  </div>

  <div class="card">
    <div class="muted" id="progress"></div>
    <div class="en" style="font-size:1.25rem;margin-top:4px"><span id="qEn"></span> <button class="play" id="qPlay">🔊</button></div>
    <div class="ko" id="qKo"></div>
  </div>

  <div class="card">
    <div class="muted">① 이 뜻을 영어로 조립해 보세요</div>
    <div style="font-size:1.1rem;margin:4px 0 12px"><b id="aKo"></b></div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool"></div>
    <div class="row" style="margin-top:12px">
      <button id="hintBtn">💡 힌트 (다음 단어)</button>
      <button id="resetBtn">↺ 다시</button>
    </div>
    <div id="buildMsg"></div>
  </div>

  <div class="card" id="speakCard" hidden>
    <div class="muted">② 이제 소리 내어 말해 보세요</div>
    <div class="en" style="margin:6px 0"><span id="target"></span> <button class="play" id="tPlay">🔊</button></div>
    <div class="blocks" id="chunks"></div>
    <div class="row" style="margin-top:12px">
      <button id="micBtn" class="primary">🎙️ 말하기</button>
      <button id="nextBtn">다음 문장 ▶</button>
    </div>
    <div id="heard" class="heard"></div>
    <div id="speakMsg"></div>
  </div>
</div>
<script src="pwa.js"></script>
<script src="lessons.js"></script>
<script src="seed.js"></script>
<script src="store.js"></script>
<script src="practice.js"></script>
</body>
</html>
